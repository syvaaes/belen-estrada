<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal de prueba</title>
<style>
/* Modal general */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background-color: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
  z-index: 9999;
  padding: 20px;
}

/* Contenido */
.modal-contenido {
  display: flex;
  flex-direction: row;
  max-width: 800px;
  width: 100%;
  background-color: #fff;
  padding: 20px;
  border-radius: 8px;
  position: relative;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

/* Imagen */
.modal-contenido img {
  max-width: 50%;
  margin-right: 20px;
  border-radius: 4px;
}

/* Texto */
.modal-texto {
  flex: 1;
}
.modal-texto h3 {
  margin-top: 0;
  color: #8b0000;
}
.modal-texto p {
  line-height: 1.5;
}

/* Botón cerrar */
.cerrar {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 2rem;
  background: none;
  border: none;
  cursor: pointer;
  color: #333;
}

/* Responsive móvil */
@media(max-width:767px){
  .modal-contenido {
    flex-direction: column;
  }
  .modal-contenido img {
    max-width: 100%;
    margin-bottom: 15px;
  }
}
</style>
</head>
<body>

<h2>Galería</h2>
<div class="obra">
  <img src="imagenes/imagen_1.jpg"
       alt="Obra 1"
       onclick="abrirModal(this.src,'Obra 1','Descripción de la obra 1')">
</div>

<div class="obra">
  <img src="https://via.placeholder.com/400x300/ff0000" 
       alt="Obra 2"
       onclick="abrirModal(this.src,'Obra 2','Descripción de la obra 2')">
</div>

<!-- Modal -->
<div id="modal" class="modal">
  <div class="modal-contenido" onclick="event.stopPropagation()">
    <button class="cerrar" onclick="cerrarModal()">&times;</button>
    <img id="modal-img" src="" alt="Imagen obra">
    <div class="modal-texto">
      <h3 id="titulo-obra">Título</h3>
      <p id="descripcion-obra">Descripción</p>
    </div>
  </div>
</div>

<script>
function abrirModal(src, titulo, descripcion){
  document.getElementById('modal-img').src = src;
  document.getElementById('titulo-obra').textContent = titulo;
  document.getElementById('descripcion-obra').textContent = descripcion;
  document.getElementById('modal').style.display = 'flex';
}

function cerrarModal(){
  document.getElementById('modal').style.display = 'none';
}

// Cerrar con tecla ESC
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') cerrarModal();
});
</script>

</body>
</html>
